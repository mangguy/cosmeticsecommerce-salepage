<!-- ทำให้บล็อก ```mermaid render บน GitHub Pages (ธีม Jekyll minima ไม่ทำให้เอง) -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  // kramdown+rouge ใส่ class "language-mermaid" ไว้บน <div> ที่ครอบ ไม่ใช่บน <code>
  // จึงเลือกที่ .language-mermaid แล้วแทนที่ด้วย <pre class="mermaid"> ให้ mermaid หาเจอ
  document.querySelectorAll(".language-mermaid").forEach((el) => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = el.textContent.trim();
    el.replaceWith(pre);
  });
  // ES module รันแบบ defer → event load มัก fire ไปแล้ว startOnLoad จึงไม่ทำงาน
  // เรียก run() เองหลัง replace เสร็จให้ชัวร์
  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  mermaid.run();
</script>
